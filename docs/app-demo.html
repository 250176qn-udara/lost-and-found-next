<title>Lost &amp; Found Live Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: the real app's shell (navy sidebar + content) inside a demo frame; a guide strip above says whose turn it is, a log beside it says what the system did. */
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#0f172a; --text:#1e293b; --mute:#64748b; --line:#e2e8f0; --line2:#eef2f6; --field:#cbd5e1; --soft:#f8fafc;
  --brand:#2563eb; --brand-dk:#1d4ed8; --brand-bg:#eff6ff; --on-brand:#ffffff;
  --amber:#d97706; --amber-bg:#fffbeb; --amber-tx:#92400e; --amber-line:#fde68a;
  --green:#15803d; --green-bg:#ecfdf3; --green-line:#bbf7d0;
  --red:#dc2626; --red-bg:#fef2f2; --red-line:#fecaca;
  --violet:#6d28d9; --violet-bg:#ede9fe;
  --side:#0f172a; --side-2:#1e293b; --side-tx:#cbd5e1; --side-mute:#64748b;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.07); --shadow-lg:0 14px 34px -14px rgba(15,23,42,.28);
  --font:"Inter","Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1120; --card:#131c2e; --ink:#f1f5f9; --text:#dbe3ee; --mute:#94a3b8; --line:#263247; --line2:#1c2638; --field:#334155; --soft:#0f1729;
  --brand:#5b8def; --brand-dk:#93b4f7; --brand-bg:#16233d; --on-brand:#0b1120;
  --amber:#f0a73a; --amber-bg:#2b2011; --amber-tx:#f6c77a; --amber-line:#5a4318;
  --green:#4ade80; --green-bg:#0f2a1b; --green-line:#1d5a35;
  --red:#f87171; --red-bg:#2e1416; --red-line:#5c2226;
  --violet:#c4b5fd; --violet-bg:#271f45;
  --side:#070b15; --side-2:#141c2d; --side-tx:#cbd5e1; --side-mute:#64748b;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 14px 34px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1120; --card:#131c2e; --ink:#f1f5f9; --text:#dbe3ee; --mute:#94a3b8; --line:#263247; --line2:#1c2638; --field:#334155; --soft:#0f1729;
  --brand:#5b8def; --brand-dk:#93b4f7; --brand-bg:#16233d; --on-brand:#0b1120;
  --amber:#f0a73a; --amber-bg:#2b2011; --amber-tx:#f6c77a; --amber-line:#5a4318;
  --green:#4ade80; --green-bg:#0f2a1b; --green-line:#1d5a35;
  --red:#f87171; --red-bg:#2e1416; --red-line:#5c2226;
  --violet:#c4b5fd; --violet-bg:#271f45;
  --side:#070b15; --side-2:#141c2d; --side-tx:#cbd5e1; --side-mute:#64748b;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 14px 34px -14px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:14.5px/1.6 var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
.page{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:18px 40px;display:grid;gap:16px}
h1,h2,h3{color:var(--ink);text-wrap:balance;margin:0}
.meta{color:var(--mute);font-size:13px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- demo header ---------- */
.dhead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.dhead h1{font-size:22px;letter-spacing:-.015em;display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:var(--on-brand);flex:none}
.dhead p{margin:2px 0 0;max-width:62ch}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--line2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--mute);font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:7px;position:relative}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg .turn-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px var(--amber-bg)}
.avatar{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:none}
.av-a{background:var(--amber-bg);color:var(--amber-tx)} .av-k{background:var(--violet-bg);color:var(--violet)} .av-s{background:var(--brand-bg);color:var(--brand-dk)}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:13.5px}

/* ---------- guide strip ---------- */
.guide{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);display:grid;gap:12px}
.journey{list-style:none;margin:0;padding:0;display:flex}
.journey li{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.journey li::before{content:"";position:absolute;top:14px;left:-50%;right:50%;height:2px;background:var(--line)}
.journey li:first-child::before{display:none}
.journey li.done::before,.journey li.now::before{background:var(--brand)}
.jdot{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;background:var(--card);border:2px solid var(--field);color:var(--mute);transition:background .25s,border-color .25s}
.journey li.done .jdot{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.journey li.now .jdot{background:var(--amber);border-color:var(--amber);color:#fff;box-shadow:0 0 0 6px var(--amber-bg);animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.jlbl{font-size:12px;color:var(--mute);margin-top:6px;line-height:1.25;padding-inline:2px}
.journey li.done .jlbl{color:var(--brand-dk)} .journey li.now .jlbl{color:var(--amber-tx);font-weight:600}
.turn{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--amber-bg);border:1px solid var(--amber-line)}
.turn p{margin:0;flex:1;min-width:220px;color:var(--text)}
.turn.done{background:var(--green-bg);border-color:var(--green-line)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.chip.you{background:var(--amber);color:#fff} .chip.staff{background:var(--brand-bg);color:var(--brand-dk)}
.chip.other{background:var(--violet-bg);color:var(--violet)} .chip.auto{background:var(--ink);color:var(--bg)} .chip.done{background:var(--green);color:#fff}

/* ---------- stage: app + log ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-lg);min-height:560px}
.side{background:var(--side);color:var(--side-tx);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.side .brandrow{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;padding:2px 8px 10px}
.side .org{font-size:11.5px;background:var(--side-2);border-radius:8px;padding:7px 10px;margin:0 2px 10px;display:flex;gap:7px;align-items:center}
.side .org::before{content:"";width:7px;height:7px;border-radius:50%;background:#22c55e;flex:none}
.side .grp{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-mute);padding:10px 10px 4px;font-weight:600}
.side button{display:flex;align-items:center;gap:9px;border:0;background:none;color:var(--side-tx);text-align:left;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13.5px}
.side button:hover{background:var(--side-2);color:#fff}
.side button[aria-current="page"]{background:var(--brand);color:#fff}
.side .cnt{margin-left:auto;background:var(--red);color:#fff;border-radius:99px;font-size:10.5px;font-weight:700;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;gap:12px;padding-inline:16px}
.bell{position:relative;width:34px;height:34px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;color:var(--mute)}
.bell .cnt{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:99px;font-size:10.5px;font-weight:700;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--card)}
.who{display:flex;align-items:center;gap:8px;font-size:13px}
.who b{color:var(--ink);display:block;line-height:1.2}
.content{padding:18px 20px 24px;display:grid;gap:14px;align-content:start;animation:rise .3s ease}
.content h2{font-size:20px;letter-spacing:-.01em}

/* ---------- app building blocks ---------- */
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.cat{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--amber-bg);color:var(--amber-tx);flex:none}
.badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:500;background:var(--amber-bg);color:var(--amber-tx);border:1px solid var(--amber-line)}
.badge.ok{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
.badge.blue{background:var(--brand-bg);color:var(--brand-dk);border-color:transparent}
.btn{border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);padding:8px 16px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.07)} .btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sec{background:var(--card);color:var(--text);border-color:var(--line)}
.btn.bad{background:var(--card);color:var(--red);border-color:var(--red-line)}
.btn.pulse{animation:pulse 1.8s ease-in-out infinite}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.next{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:var(--soft)}
.next p{flex:1;min-width:200px;margin:0;font-size:14px}
.next.you{background:var(--amber-bg);border-color:var(--amber-line)}
.next.done{background:var(--green-bg);border-color:var(--green-line)}
.mini{list-style:none;margin:0;padding:0;display:flex;gap:0}
.mini li{flex:1;position:relative;display:flex;justify-content:center}
.mini li::before{content:"";position:absolute;top:9px;left:-50%;right:50%;height:2px;background:var(--line)}
.mini li:first-child::before{display:none}
.mini li.done::before,.mini li.now::before{background:var(--brand)}
.mini span{position:relative;z-index:1;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;background:var(--card);border:2px solid var(--field);color:var(--mute)}
.mini li.done span{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.mini li.now span{background:var(--amber);border-color:var(--amber);color:#fff}
.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:500;color:var(--text)}
.field input,.field textarea,.field select{width:100%;padding:8px 11px;border:1px solid var(--field);border-radius:8px;background:var(--card)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.priv{border:1px dashed #fdba74;background:var(--amber-bg);border-radius:9px;padding:9px 12px;font-size:13.5px}
.priv small{display:block;color:var(--amber-tx);font-weight:600;margin-bottom:2px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp > div{background:var(--soft);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:13.5px}
.cmp small{display:block;color:var(--mute);font-size:12px;margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.score{font-size:30px;font-weight:700;color:var(--green);line-height:1;font-variant-numeric:tabular-nums}
.pill{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--brand-bg);color:var(--brand-dk)}
.pass{border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:14px;padding:16px;text-align:center;max-width:320px}
.pin{font-family:var(--mono);font-size:32px;font-weight:700;letter-spacing:.28em;color:var(--brand-dk);background:var(--brand-bg);border-radius:10px;padding:6px 0 6px .28em;margin:8px 0;font-variant-numeric:tabular-nums}
.code{font-family:var(--mono);font-weight:600;letter-spacing:.04em}
.codeinput{font-family:var(--mono);letter-spacing:.3em;font-size:18px;text-align:center;max-width:200px}
.chk{display:flex;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--brand)}
.chat{display:flex;flex-direction:column;gap:6px;background:var(--soft);border:1px solid var(--line2);border-radius:12px;padding:12px;min-height:120px}
.bubble{max-width:82%;padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);white-space:pre-line;animation:rise .25s ease;font-size:14px}
.bubble.me{align-self:flex-end;background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.bubble small{display:block;opacity:.75;font-size:11px;margin-top:2px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;color:var(--mute);font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.tabs .n{background:var(--brand);color:var(--on-brand);border-radius:99px;font-size:11px;padding:0 7px;line-height:18px}
.letter{position:relative;border-radius:16px;padding:20px 20px 16px;border:1px solid var(--line);background:linear-gradient(160deg,var(--amber-bg),var(--card) 60%);box-shadow:var(--shadow-lg);max-width:420px}
.letter h3{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:24px;color:var(--amber-tx)}
.letter p{white-space:pre-line;margin:8px 0}
.reacts{display:flex;gap:6px}
.reacts button{font-size:19px;width:40px;height:36px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:transform .15s}
.reacts button:hover{transform:translateY(-2px) scale(1.08)}
.reacts button[aria-pressed="true"]{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-bg)}
.gifts{display:flex;gap:6px;flex-wrap:wrap}
.gifts button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 14px;cursor:pointer;font-size:13.5px}
.gifts button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{text-align:center;padding:28px 16px;border:1px dashed var(--field);border-radius:12px;color:var(--mute)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line2);font-size:14px}
.kv:last-child{border-bottom:0} .kv span{color:var(--mute)} .kv b{text-align:right;font-weight:600}

/* ---------- behind the scenes ---------- */
.log{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);display:grid;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.log h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.log ol{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--line);display:grid;gap:10px;max-height:520px;overflow-y:auto}
.log li{position:relative;font-size:13.5px;animation:rise .3s ease}
.log li::before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--brand)}
.log li.sys::before{background:var(--ink);border-color:var(--ink)}
.log li b{color:var(--ink)}
.log li small{display:block;color:var(--mute);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow-lg)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.5)}to{transform:scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.45)}50%{box-shadow:0 0 0 7px rgba(37,99,235,0)}}
@media (max-width:980px){.stage{grid-template-columns:minmax(0,1fr)}.log{position:static}}
@media (max-width:700px){.app{grid-template-columns:minmax(0,1fr)}.side{flex-direction:row;flex-wrap:wrap;gap:4px}.side .brandrow,.side .org,.side .grp{display:none}
  .two,.cmp{grid-template-columns:1fr}.jlbl{font-size:10px}.jdot{width:24px;height:24px;font-size:11px}.journey li::before{top:11px}.content{padding:14px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="page">
  <header class="dhead">
    <div>
      <h1><span class="logo" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="m20 20-4.8-4.8"/></svg></span><span id="title"></span></h1>
      <p class="meta" id="sub"></p>
    </div>
    <div class="controls">
      <div class="seg" role="group" id="roles" aria-label="Role"></div>
      <div class="seg" role="group" aria-label="Language"><button type="button" id="bEn">EN</button><button type="button" id="bJa">日本語</button></div>
      <button type="button" class="ghost" id="reset"></button>
    </div>
  </header>

  <section class="guide" aria-live="polite">
    <ol class="journey" id="journey"></ol>
    <div class="turn" id="turn"></div>
  </section>

  <div class="stage">
    <div class="app">
      <nav class="side" id="side" aria-label="App menu"></nav>
      <div class="main">
        <div class="topbar" id="topbar"></div>
        <div class="content" id="content"></div>
      </div>
    </div>
    <aside class="log">
      <h2 id="logT"></h2>
      <ol id="log"></ol>
    </aside>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  var LANG = 'en';
  try { LANG = localStorage.getItem('lf-live-demo-lang') || ((navigator.language || '').indexOf('ja') === 0 ? 'ja' : 'en'); } catch (e) {}
  function L(en, ja) { return LANG === 'ja' ? ja : en; }
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /* ---------- the story: one wallet, ten actions, three people ---------- */
  var PEOPLE = {
    aiko: { name: 'Aiko Tanaka', short: 'Aiko', av: 'AT', cls: 'av-a', role: function () { return L('Member · lost it', '会員・なくした人'); } },
    ken:  { name: 'Ken Mori',    short: 'Ken',  av: 'KM', cls: 'av-k', role: function () { return L('Member · found it', '会員・見つけた人'); } },
    sara: { name: 'Sara Ito',    short: 'Sara', av: 'SI', cls: 'av-s', role: function () { return L('Staff · front desk', 'スタッフ・受付'); } }
  };
  // actor of action number s (s = how many actions are done)
  var ACTOR = ['aiko', 'ken', 'aiko', 'sara', 'ken', 'sara', 'aiko', 'sara', 'aiko', 'ken'];
  // the page each action happens on
  var WHERE = ['report', 'report', 'myitems', 'desk', 'myitems', 'desk', 'myitems', 'desk', 'myitems', 'myitems'];
  var TODO = [
    function () { return L('Aiko lost her wallet. Report it as lost.', 'Aikoさんが財布をなくしました。「なくしました」で届け出ます。'); },

    return '<h2>' + L('Hello, ', 'こんにちは、') + p.short + L('', 'さん') + '</h2>' + (action || '<div class="meta">' + L('No action needed right now.', '今やることはありません。') + '</div>') +
      (items ? '<h3 style="font-size:15px">' + L('Your items', 'あなたのアイテム') + '</h3>' + items : '');
  }

  function pageDesk() {
    var tabs = [['verify', L('Verify claims', '請求を確認'), S === 3 ? 1 : 0], ['finders', L('From finders', '発見者から'), S === 5 ? 1 : 0], ['pickups', L('Pickups', '受け取り'), (S >= 4 && S <= 7) ? 1 : 0]];
    var html = '<h2>' + L('Front desk', '受付') + '</h2><div class="tabs" role="tablist">' + tabs.map(function (t) {
      return '<button type="button" role="tab" data-tab="' + t[0] + '" aria-selected="' + (TAB === t[0]) + '">' + t[1] + (t[2] ? '<span class="n">' + t[2] + '</span>' : '') + '</button>';
    }).join('') + '</div>';
    if (TAB === 'verify') {
      if (S !== 3) return html + (S < 3 ? waitBox() : '<div class="empty"><b>' + L('No claims to verify.', '確認待ちの請求はありません。') + '</b></div>');
      return html + '<div class="box" style="display:grid;gap:12px">' + walletCard(L('claimed by Aiko Tanaka', '申請者：Aiko Tanaka')) +
        next('you', L('Your turn', 'あなたの番'), L('Compare the claimant’s answer with the private details, then approve or reject.', '申請者の答えと非公開の特徴を見くらべて、承認か却下をしてください。')) +
        '<div class="cmp"><div><small>' + L('What Aiko says', 'Aikoさんの答え') + '</small>' + L('Black ✔ · brand Tanaka ✔ · scratch on the front ✔ · library card inside ✔', '黒 ✔・Tanaka ✔・前にキズ ✔・図書館カード ✔') + '</div>' +
        '<div class="priv" style="border-radius:10px"><small>' + L('Private details (from Ken)', '非公開の特徴（Kenさん）') + '</small>' + L('Black · Tanaka · scratch on the front · a library card inside', '黒・Tanaka・前にキズ・中に図書館カード') + '</div></div>' +
        (F.asked ? '<div class="chat"><div class="bubble me">' + L('Which library card is inside?', 'どの図書館のカードが入っていますか？') + '<small>' + L('You', 'あなた') + '</small></div><div class="bubble">' + L('Yokohama City Library, under my name.', '横浜市立図書館のカードで、私の名前です。') + '<small>Aiko</small></div></div>' : '') +
        '<div class="btnrow">' + act(L('Approve — it matches', '承認（一致しています）'), 'approve') +
        (F.asked ? '' : '<button type="button" class="btn sec" data-ask="1">' + L('Ask Aiko a question', 'Aikoさんに質問する') + '</button>') +
        '<button type="button" class="btn bad" data-reject="1">' + L('Reject', '却下する') + '</button></div></div>';
    }
    if (TAB === 'finders') {
      if (S === 5) return html + '<div class="box" style="display:grid;gap:12px">' + walletCard(L('Found by Ken Mori · ', '発見者：Ken Mori・') + '<span class="code">' + ITEM + '</span>', '<span class="badge ok">' + L('Finder says it is at the office', '発見者が事務所に届けた') + '</span>') +
        next('you', L('Your turn', 'あなたの番'), L('The wallet is at the desk. Confirm it and choose a shelf.', '財布が受付にあります。確認して、たなを選んでください。')) +
        '<div class="field" style="max-width:220px"><label for="sh">' + L('Shelf', 'たな') + '</label><select id="sh"><option>' + SHELF + '</option><option>A-01</option><option>B-01</option></select></div>' +
        '<div class="btnrow">' + act(L('Confirm and add shelf', '確認して棚を登録'), 'receive') + '</div></div>';
      return html + (S < 5 ? waitBox() : '<div class="empty"><b>' + L('No found items are waiting outside the office.', '事務所の外で保管中の拾得物はありません。') + '</b></div>');
    }
    // pickups
    if (S < 4) return html + waitBox();
    if (S >= 8) return html + '<div class="empty"><b>' + L('No pickups waiting.', '受け取り待ちはありません。') + '</b>' + L('The wallet was handed over to Aiko.', '財布はAikoさんにわたしました。') + '</div>';
    var ready = S >= 6, here = S === 7;
    var ok = here && F.ho1 && F.ho2 && F.code.replace(/\D/g, '') === CODE;
    return html + '<div class="box" style="display:grid;gap:10px">' + walletCard(L('Owner: Aiko Tanaka · ', '持ち主：Aiko Tanaka・') + '<span class="code">' + ITEM + '</span>', '<span class="badge ' + (ready ? 'ok' : '') + '">' + (ready ? L('Shelf ', 'たな ') + SHELF : L('Still with the finder', '発見者が保管中')) + '</span>') +
      (S < 6 ? next('other', L('The finder', '見つけた人'), L('Waiting for Ken to bring it to the office.', 'Kenさんが事務所に届けるのを待っています。'))
       : S === 6 ? next('other', L('The owner', '持ち主'), L('Waiting for Aiko to come to the office.', 'Aikoさんが事務所に来るのを待っています。'))
       : next('you', L('Your turn', 'あなたの番'), L('Aiko is here. Enter the code she tells you, check her ID, then hand it over.', 'Aikoさんが来ました。コードを入力し、身分証を確認してからわたしてください。'))) +
      (here ? '<div class="field"><label for="pc">' + L('Pickup code from Aiko', 'Aikoさんから聞いたコード') + '</label><div class="row"><input id="pc" class="codeinput" inputmode="numeric" maxlength="7" placeholder="000000" value="' + esc(F.code) + '"><button type="button" class="btn sec" data-says="1">' + L('Aiko says: ', 'Aikoさん：') + '<span class="code">' + CODE.slice(0, 3) + ' ' + CODE.slice(3) + '</span></button></div></div>' +
        '<label class="chk"><input type="checkbox" id="h1"' + (F.ho1 ? ' checked' : '') + '> ' + L('Photo ID matches the owner (student ID)', '写真つき身分証（学生証）が本人と一致') + '</label>' +
        '<label class="chk"><input type="checkbox" id="h2"' + (F.ho2 ? ' checked' : '') + '> ' + L('Answers match the item', '回答が物と一致') + '</label>' +
        '<div class="btnrow"><button type="button" class="btn' + (ok ? ' pulse' : '') + '" data-act="handover"' + (ok ? '' : ' disabled') + '>' + L('Complete handover', '返却を完了') + '</button></div>' +
        (ok ? '' : '<span class="meta">' + (F.code.replace(/\D/g, '') !== CODE ? L('Enter the 6-digit pickup code the owner tells you.', '持ち主から聞いた6桁のコードを入力してください。') : L('Tick every check above.', '上のチェックをすべて付けてください。')) + '</span>') : '') + '</div>';
  }

  function pageMessages() {
    var msgs = ME === 'sara' ? CHAT.ken : CHAT[ME];
    var title = ME === 'sara' ? 'Ken Mori' : L('Office', '事務所');
    var body = msgs.length ? msgs.map(function (m) {
      var mine = ME === 'sara' ? !m.me : m.me;
      return '<div class="bubble' + (mine ? ' me' : '') + '">' + esc(m.text) + '<small>' + (mine ? L('You', 'あなた') : esc(m.from)) + '</small></div>';
    }).join('') : '<div class="meta" style="margin:auto">' + L('No messages yet.', 'まだメッセージはありません。') + '</div>';
    return '<h2>' + L('Messages', 'メッセージ') + '</h2><div class="box" style="display:grid;gap:10px"><b style="color:var(--ink)">' + title + '</b><div class="chat">' + body + '</div>' +
      '<form class="row" id="msgForm"><input id="msgIn" class="grow" style="padding:8px 11px;border:1px solid var(--field);border-radius:8px;background:var(--card)" placeholder="' + L('Write a message', 'メッセージを入力') + '" aria-label="' + L('Message', 'メッセージ') + '"><button class="btn" type="submit">' + L('Send', '送信') + '</button></form></div>';
  }

  /* ---------- render ---------- */
  function navFor() {
    if (ME === 'sara') return [['desk', L('Front desk', '受付'), 'desk'], ['messages', L('Messages', 'メッセージ'), 'chat']];
    return [['home', L('Home', 'ホーム'), 'home'], ['report', L('Report an item', '落とし物を届ける'), 'plus'], ['myitems', L('My items', 'マイアイテム'), 'box'], ['messages', L('Messages', 'メッセージ'), 'chat']];
  }
  function render() {
    document.documentElement.lang = LANG;
    $('title').textContent = L('Lost & Found: live demo', '落とし物管理：体験デモ');
    $('sub').textContent = L('One lost wallet, three people. Play each part in turn. Nothing is saved.', 'なくした財布1つと3人。順番に役を切り替えて体験できます。データは保存されません。');
    $('reset').textContent = L('Start over', 'はじめから');
    $('bEn').setAttribute('aria-pressed', LANG === 'en'); $('bJa').setAttribute('aria-pressed', LANG === 'ja');
    $('logT').textContent = L('Behind the scenes', 'システムの中では');

    $('roles').innerHTML = ['aiko', 'ken', 'sara'].map(function (k) {
      var p = PEOPLE[k], turn = S < 10 && ACTOR[S] === k;
      return '<button type="button" data-role="' + k + '" aria-pressed="' + (ME === k) + '"><span class="avatar ' + p.cls + '">' + p.av + '</span>' + p.short + (turn ? '<span class="turn-dot" title="' + L('Their turn', 'この人の番') + '"></span>' : '') + '</button>';
    }).join('');

    var d = journeyDone(S), now = d.indexOf(false);
    $('journey').innerHTML = JOURNEY.map(function (j, i) {
      return '<li class="' + (d[i] ? 'done' : i === now ? 'now' : '') + '"' + (i === now ? ' aria-current="step"' : '') + '><span class="jdot">' + (d[i] ? '✓' : i + 1) + '</span><span class="jlbl">' + L(j[0], j[1]) + '</span></li>';
    }).join('');

    var turn = $('turn');
    if (S >= 10) {
      turn.className = 'turn done';
      turn.innerHTML = '<span class="chip done">' + L('Done', '完了') + '</span><p>' + L('The wallet is back with Aiko, and Ken got his thanks. That is the whole system.', '財布はAikoさんに戻り、Kenさんにお礼が届きました。これがシステムの全体です。') + '</p><button type="button" class="btn sec" data-restart="1">' + L('Start over', 'はじめから') + '</button>';
    } else {
      var who = ACTOR[S], p = PEOPLE[who];
      turn.className = 'turn';
      turn.innerHTML = '<span class="chip you"><span class="avatar ' + p.cls + '" style="width:18px;height:18px;font-size:9px">' + p.av + '</span>' + L(p.short + '’s turn', p.short + 'さんの番') + '</span><p>' + TODO[S]() + '</p>' +
        (ME === who ? (PAGE !== WHERE[S] ? '<button type="button" class="btn" data-go="' + WHERE[S] + '">' + L('Show me where', '場所をひらく') + '</button>' : '<span class="meta">' + L('↓ Do it in the app below', '↓ 下のアプリで操作してください') + '</span>')
                    : '<button type="button" class="btn" data-role="' + who + '">' + L('Switch to ', '') + p.short + L('', 'に切り替え') + ' →</button>');
    }

    var unread = myTurn() ? 1 : 0;
    $('side').innerHTML = '<div class="brandrow"><span class="logo" style="width:24px;height:24px;border-radius:7px">' + ic('home', 0).replace('width="0" height="0"', 'width="13" height="13"') + '</span>' + L('Lost & Found', '落とし物管理') + '</div>' +
      '<div class="org">' + L('Yokohama System Engineering College', '横浜システム工学院専門学校') + '</div><div class="grp">' + (ME === 'sara' ? L('Front desk', '受付') : L('Menu', 'メニュー')) + '</div>' +
      navFor().map(function (n) {
        var badge = (myTurn() && WHERE[S] === n[0]) ? '<span class="cnt">1</span>' : '';
        return '<button type="button" data-go="' + n[0] + '"' + (PAGE === n[0] ? ' aria-current="page"' : '') + '>' + ic(n[2]) + n[1] + badge + '</button>';
      }).join('');
    var p2 = PEOPLE[ME];
    $('topbar').innerHTML = '<span class="bell" title="' + L('Notifications', '通知') + '">' + ic('bell') + (unread ? '<span class="cnt">1</span>' : '') + '</span>' +
      '<div class="who"><span class="avatar ' + p2.cls + '" style="width:30px;height:30px;font-size:11px">' + p2.av + '</span><div><b>' + p2.name + '</b><span class="meta">' + p2.role() + '</span></div></div>';

    var c = PAGE === 'report' ? pageReport() : PAGE === 'myitems' ? pageMyItems() : PAGE === 'desk' ? pageDesk() : PAGE === 'messages' ? pageMessages() : pageHome();
    $('content').innerHTML = c || pageHome();

    $('log').innerHTML = LOG.length ? LOG.map(function (e) {
      return '<li class="' + (e.sys ? 'sys' : '') + '"><b>' + (e.sys ? L('System', 'システム') : PEOPLE[e.who].short) + '</b><small>' + (LANG === 'ja' ? e.ja : e.en) + '</small></li>';
    }).join('') : '<li class="sys"><b>' + L('Ready', '準備OK') + '</b><small>' + L('Each action shows up here with what the system did.', '操作するたびに、システムがしたことがここに出ます。') + '</small></li>';
    var lg = $('log'); lg.scrollTop = lg.scrollHeight;
  }

  function defaultPage(role) {
    if (S < 10 && ACTOR[S] === role) return WHERE[S];
    return role === 'sara' ? 'desk' : 'myitems';
  }
  function deskTab() { return S === 5 ? 'finders' : S >= 4 && S !== 5 ? 'pickups' : 'verify'; }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('button') : null;
    if (!t) return;
    if (t.dataset.role) { ME = t.dataset.role; PAGE = defaultPage(ME); TAB = deskTab(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if (t.dataset.go) { PAGE = t.dataset.go; if (PAGE === 'desk') TAB = deskTab(); render(); return; }
    if (t.dataset.tab) { TAB = t.dataset.tab; render(); return; }
    if (t.dataset.act) {
      if (t.dataset.act === 'thank') { var tl = $('t1'); F.letter = tl ? tl.value.trim() : F.letter; if (!F.letter) { toast(L('Please write a few words first.', '先に一言書いてください。')); return; } }
      doAction(t.dataset.act); return;
    }
    if (t.dataset.gift) { var tl2 = $('t1'); if (tl2) F.letter = tl2.value; F.gift = parseInt(t.dataset.gift, 10); render(); return; }
    if (t.dataset.react) { if (S !== 9 && F.react) return; F.react = t.dataset.react; if (S === 9) doAction('react'); else render(); return; }
    if (t.dataset.says) { F.code = CODE; render(); return; }
    if (t.dataset.ask) { F.asked = true; CHAT.aiko.push({ me: false, from: L('Office', '事務所'), text: L('Which library card is inside?', 'どの図書館のカードが入っていますか？') }); CHAT.aiko.push({ me: true, from: 'Aiko', text: L('Yokohama City Library, under my name.', '横浜市立図書館のカードで、私の名前です。') }); log('sara', 'Sara asked Aiko a question. Aiko answered in Messages.', 'SaraさんがAikoさんに質問し、Aikoさんがメッセージで答えました。'); render(); return; }
    if (t.dataset.reject) { toast(L('In the real app, Aiko is told and the item stays listed. For this story, approve.', '本当のアプリでは持ち主に知らされ、物は一覧に残ります。このデモでは承認してください。')); return; }
    if (t.dataset.restart || t.id === 'reset') { reset(); render(); return; }
    if (t.id === 'bEn' || t.id === 'bJa') { LANG = t.id === 'bJa' ? 'ja' : 'en'; try { localStorage.setItem('lf-live-demo-lang', LANG); } catch (err) {} render(); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'h1') { F.ho1 = e.target.checked; render(); }
    if (e.target.id === 'h2') { F.ho2 = e.target.checked; render(); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'pc') {
      F.code = e.target.value;
      var pos = e.target.selectionStart; render();
      var el = $('pc'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (err) {} }
    }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'msgForm') return;
    e.preventDefault();
    var v = ($('msgIn').value || '').trim(); if (!v) return;
    if (ME === 'sara') CHAT.ken.push({ me: false, from: L('Office', '事務所'), text: v });
    else CHAT[ME].push({ me: true, from: PEOPLE[ME].short, text: v });
    render();
  });

  render();
})();
</script>
